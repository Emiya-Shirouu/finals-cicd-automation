# REQUIREMENT 5.1 (bullet 1): three application modules (frontend, api, lookup),
# each in its OWN container, plus a database container.
services:
  frontend:                      # module 1
    build: ./frontend
    ports: ["3080:80"]
    depends_on: [api, lookup]

  api:                           # module 2 - reads/writes the database (bullet 2)
    build: ./api
    environment:
      DATABASE_URL: postgres://library:library@db:5432/library
    depends_on:
      db: { condition: service_healthy }
    healthcheck:                 # bullet 3: health check uses GET /health
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s

  lookup:                        # module 3
    build: ./lookup
    healthcheck:                 # bullet 3
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s

  db:
    build: ./db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s

  
volumes:
  dbdata:
