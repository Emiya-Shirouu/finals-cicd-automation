# REQUIREMENT 5.1 (bullet 1): the frontend container serves the pages and
# forwards API calls to the other two containers (api + lookup).
server {
  listen 80;
  root /usr/share/nginx/html;

  location = /health { return 200 "ok"; }   # health endpoint for the frontend too

  location /api/lookup { proxy_pass http://lookup:3001; }
  location /api/       { proxy_pass http://api:3000; }
}
