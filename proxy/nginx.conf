server {
    listen 8080;
    server_name _;

    # Docker's built-in DNS: names are looked up per request, so the proxy
    # keeps working when a container is recreated during a redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Health endpoint of the proxy itself
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/lookup...  -> lookup container (path is passed through unchanged)
    location /api/lookup {
        set $lookup_upstream http://lookup:3001;
        proxy_pass $lookup_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/...  (books) -> api container (path is passed through unchanged)
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # everything else -> frontend container
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
