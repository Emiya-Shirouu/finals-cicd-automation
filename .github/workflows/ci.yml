# REQUIREMENT 5.1 (bullet 4): automated tests run in the pipeline on every push.
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd api && npm install && npm test
      - run: cd lookup && npm install && npm test
  # Smoke test: start everything and call the health endpoint (bullet 3).
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: sleep 15 && curl -f http://localhost:8080/health && curl -f http://localhost:8080/api/books
